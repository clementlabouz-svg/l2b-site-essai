<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Fond L2B ENERGIES : formes douces + vagues superposées (style Haikei), écrit à la main.
       Couleurs de la charte : #5FB562, #499401, #013927 (sur fond crème #F5FFFA posé en CSS). -->
  <defs>
    <path id="f" d="M430 40C520 50 585 120 580 210C575 290 520 330 500 390C480 450 400 480 330 455C260 430 250 380 200 340C150 300 150 220 190 160C230 100 340 30 430 40Z"/>
  </defs>

  <!-- Grande forme en haut à droite -->
  <svg x="58%" y="-6%" width="48%" height="48%" viewBox="0 0 600 600" preserveAspectRatio="xMaxYMin meet" overflow="visible">
    <use href="#f" fill="#5FB562" opacity=".13"/>
    <use href="#f" fill="#499401" opacity=".09" transform="translate(150 95) scale(.62)"/>
    <circle cx="140" cy="470" r="22" fill="#5FB562" opacity=".16"/>
  </svg>

  <!-- Forme plus discrète à gauche, à mi-hauteur -->
  <svg x="-12%" y="38%" width="34%" height="34%" viewBox="0 0 600 600" preserveAspectRatio="xMinYMid meet" overflow="visible">
    <use href="#f" fill="#499401" opacity=".07" transform="rotate(140 400 230)"/>
    <circle cx="520" cy="120" r="14" fill="#013927" opacity=".08"/>
  </svg>

  <!-- Vagues superposées, collées en bas (170 px de haut, pleine largeur) -->
  <g transform="translate(0 -170)">
    <svg y="100%" width="100%" height="170" viewBox="0 0 1440 240" preserveAspectRatio="none">
      <path fill="#5FB562" opacity=".18" d="M0 96C180 60 360 40 540 70C720 100 900 140 1080 120C1260 100 1350 70 1440 80V240H0Z"/>
      <path fill="#499401" opacity=".14" d="M0 150C160 130 320 110 500 130C680 150 820 185 1000 170C1180 155 1320 125 1440 135V240H0Z"/>
      <path fill="#013927" opacity=".12" d="M0 200C200 185 380 170 560 185C740 200 900 220 1080 210C1260 200 1360 185 1440 190V240H0Z"/>
    </svg>
  </g>
</svg>
